<svg xmlns="http://www.w3.org/2000/svg" width="{{w}}" height="{{h}}" viewBox="0 0 100 62">
<!-- Split-flap tiles: two units of elapsed time, each with a hinge line and its unit beneath. 100x62 units. -->
{{#each tiles}}<g transform="translate({{x}} 0)">
  <rect width="{{tw}}" height="{{th}}" rx="{{rx}}" fill="{{line}}"/>
  <rect x="0.5" y="0.5" width="{{inner}}" height="{{innerH}}" rx="{{rx}}" fill="none" stroke="{{dim}}" stroke-width="0.7"/>
  <line x1="0" y1="{{mid}}" x2="{{tw}}" y2="{{mid}}" stroke="{{dim}}" stroke-width="0.7"/>
  {{#if square}}<rect x="-0.2" y="{{mid}}" width="2.4" height="2.4" fill="{{dim}}" transform="translate(0 -1.2)"/><rect x="{{hingeX}}" y="{{mid}}" width="2.4" height="2.4" fill="{{dim}}" transform="translate(-0.2 -1.2)"/>{{else}}<circle cx="1" cy="{{mid}}" r="{{hingeR}}" fill="{{dim}}"/><circle cx="{{hingeX}}" cy="{{mid}}" r="{{hingeR}}" fill="{{dim}}"/>{{/if}}
  <text x="{{cx}}" y="{{digitY}}" dy=".35em" fill="{{fg}}" font-family="{{font}}" font-weight="700" font-size="{{digitSize}}" text-anchor="middle">{{text}}</text>
  <text x="{{cx}}" y="{{unitY}}" dy=".35em" fill="{{dim}}" font-family="{{mono}}" font-weight="700" font-size="{{unitSize}}" text-anchor="middle">{{unit}}</text>
</g>
{{/each}}</svg>
